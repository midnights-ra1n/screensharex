services:
  screensharex:
    image: ghcr.io/midnights-ra1n/screensharex:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # SSX_BASE_URL: https://img.example.com
      SSX_REDIS: redis://valkey:6379/0
    volumes:
      - screensharex-data:/data
    depends_on:
      - valkey

  # Lightweight Redis-compatible cache, memory only.
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru

volumes:
  screensharex-data:
